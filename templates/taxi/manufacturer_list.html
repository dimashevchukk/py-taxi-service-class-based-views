{% extends "base.html" %}

{% block content %}
  {% if manufacturer_list %}
    <p>Manufacturer List</p>
    <ul>
    {% for manufacturer in manufacturer_list %}
      <li>
        <p>Name: {{ manufacturer.name }}</p>
        <p>Country: {{ manufacturer.country }}</p>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No manufacturers found</p>
  {% endif %}
{% endblock %}
